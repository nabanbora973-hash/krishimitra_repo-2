<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KrishiMitra — Know Your Market. Choose Your Moment.</title>
  <meta name="theme-color" content="#0F5132">
  <meta name="description" content="Agricultural market intelligence and farm decision support: compare markets, monitor prices, review weather and crop risks.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
/* KrishiMitra design system — colors sampled from the official deck */
:root{
  --green:#0F5132; --green-mid:#1B7F4B; --green-light:#7CCB5A; --panel:#EAF5EC;
  --orange:#F28C28; --cream:#FDEBD9; --cream-tx:#7A4A14;
  --ink:#1F2A24; --muted:#5C6B62; --line:#DCEBE0;
  --blue:#1552A8; --blue-bg:#DCEBFF;
  --red:#B00020;
  --radius:14px; --shadow:0 2px 10px rgba(15,81,50,.08);
}
*{box-sizing:border-box;margin:0}
body{font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);background:#FCFEFC}
.view{display:none;max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.view.active{display:block}
h1,h2,h3{color:var(--green)}
h2{font-size:24px;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}

/* topbar */
#topbar{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);
  padding:10px 22px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.brand{font-weight:800;color:var(--green);font-size:18px}
#mainnav{display:flex;gap:4px;flex-wrap:wrap}
.navbtn{background:none;border:0;padding:8px 11px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--ink);font-family:inherit}
.navbtn:hover{background:var(--panel)}
.navbtn.on{background:var(--green);color:#fff}
#userchip{color:var(--muted);font-size:12.5px;margin-left:auto}
#footnote{padding:14px 22px 30px;color:var(--muted);font-size:12px;text-align:center}

/* cards & layout */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

/* controls */
label{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;padding:10px 12px;margin:5px 0 14px;border:1px solid var(--line);
  border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-light);border-color:var(--green-light)}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:14px;
  cursor:pointer;font-family:inherit;font-weight:600}
.btn:hover{background:var(--green-mid)}
.btn.orange{background:var(--orange)}
.btn.ghost{background:none;color:var(--green);border:1.5px solid var(--green)}
.btn.small{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:wait}

/* chips & badges */
.chip{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 10px;
  margin-left:6px;vertical-align:middle;letter-spacing:.3px}
.chip.live{background:var(--blue-bg);color:var(--blue)}
.chip.demo{background:var(--cream);color:#8A4A12}
.banner{background:var(--cream);color:var(--cream-tx);font-style:italic;padding:10px 22px;font-size:13px}

/* stats & numbers */
.stat{color:var(--green);font-weight:800;font-size:26px}
.stat.orange{color:var(--orange)}
.statlabel{color:var(--muted);font-size:12px}
.pos{color:var(--green);font-weight:700}
.neg{color:var(--red);font-weight:700}

/* tables */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tablewrap table{min-width:680px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--green);color:#fff;text-align:left;padding:9px 10px;font-size:12.5px}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr.best td{background:var(--panel)}
tr:nth-child(even) td{background:#F7FBF8}
tr.best:nth-child(even) td{background:var(--panel)}

/* bars (price chart, no library) */
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding:8px 4px 0}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar .fill{width:100%;background:var(--orange);border-radius:6px 6px 0 0;min-height:4px}
.bar .fill.bestf{background:var(--green-mid)}
.bar .lbl{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.15}
.bar .val{font-size:11px;font-weight:700;color:var(--ink)}

/* risk cards */
.risk{border-left:5px solid var(--muted);border-radius:10px;background:#fff;border:1px solid var(--line);
  padding:12px 14px;margin-bottom:10px}
.risk.high{border-left-color:var(--red)}
.risk.medium{border-left-color:var(--orange)}
.risk.opportunity{border-left-color:var(--green-mid)}
.risk .t{font-weight:700;font-size:14px}
.risk .why{color:var(--muted);font-size:12.5px;margin-top:3px}

/* weather strip */
.days{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;min-width:86px}
.day .ic{font-size:22px}
.day .dt{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.day .tp{font-size:13px;font-weight:700}
.day .rn{font-size:11px;color:var(--blue)}

/* guidance */
.gact{background:var(--panel);border-radius:12px;padding:13px 15px;margin-bottom:10px}
.gact .ttl{font-weight:800;color:var(--green);font-size:14.5px}
.gact .ds{font-size:13px;color:var(--ink);margin-top:3px}
.conf{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 12px}
.conf.high{background:var(--panel);color:var(--green)}
.conf.medium{background:var(--cream);color:var(--cream-tx)}
.conf.low{background:#FBEAEA;color:var(--red)}

/* chat */
#chatlog{height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;margin-bottom:12px}
.msg{max-width:78%;padding:10px 13px;border-radius:13px;margin-bottom:10px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.msg.user{background:var(--green);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.ai{background:var(--panel);color:var(--ink);border-bottom-left-radius:4px}
.msg.sys{background:var(--cream);color:var(--cream-tx);font-style:italic;max-width:100%}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;
  font-size:12.5px;cursor:pointer;color:var(--green);font-family:inherit;font-weight:600}
.quick button:hover{background:#dff0e3}
.chatrow{display:flex;gap:10px}
.chatrow input{margin:0}

/* states */
.loading{color:var(--muted);font-style:italic;padding:14px 0}
.errorbox{background:#FBEAEA;color:var(--red);border-radius:10px;padding:12px 14px;font-size:13.5px;margin:10px 0}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.caveat{background:var(--cream);color:var(--cream-tx);font-style:italic;font-size:12px;
  border-radius:10px;padding:10px 14px;margin-top:14px}
.sourcenote{color:var(--muted);font-size:11px;margin-top:10px}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green);
  color:#fff;padding:11px 20px;border-radius:12px;font-size:13.5px;opacity:0;transition:.25s;z-index:100;max-width:90%}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* auth screen */
#view-auth.active{display:flex;align-items:center;justify-content:center;min-height:88vh}
.authcard{width:100%;max-width:430px;text-align:center}
.authcard .logo{font-size:44px}
.authcard h1{font-size:30px;margin:6px 0 2px}
.authcard .tag{color:var(--orange);font-weight:700;font-style:italic;margin-bottom:20px}
.herr{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.demo-link{display:inline-block;margin-top:16px;color:var(--muted);font-size:12.5px}

/* ---------- demo video: dashboard card + modal player ---------- */
.dim{color:var(--muted)}
.vcard{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);margin:14px 0 4px;
  cursor:pointer;transition:.15s}
.vcard:hover{border-color:var(--green-light);transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(15,81,50,.12)}
.vthumb{width:124px;height:70px;object-fit:cover;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);flex:0 0 auto}
.vmeta{display:flex;flex-direction:column;gap:3px;font-size:14px}
.vmeta b{color:var(--green)}
.vmeta .dim{font-size:12.5px;line-height:1.35}
.vplay{flex:0 0 auto;margin-left:auto}

.vmodal{position:fixed;inset:0;background:rgba(15,32,22,.78);display:none;
  align-items:center;justify-content:center;padding:18px;z-index:200}
.vmodal.open{display:flex}
.vmodal-box{position:relative;width:100%;max-width:940px;background:#fff;border-radius:16px;
  padding:14px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.vmodal-box video{width:100%;max-height:72vh;border-radius:10px;background:#000;display:block}
.vmodal-close{position:absolute;top:-13px;right:-13px;width:34px;height:34px;border-radius:50%;
  border:0;background:var(--green);color:#fff;font-size:15px;line-height:1;cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.3);font-family:inherit}
.vmodal-close:hover{background:var(--green-mid)}
.vmodal-note{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-top:10px;
  font-size:12.5px;color:var(--ink)}
.vmodal-note .vsep{color:var(--line)}
.vmodal-note .dim{margin-left:auto;font-style:italic}
.vmodal-note a{color:var(--green);font-weight:600}
.vmodal-missing{background:var(--cream);color:var(--cream-tx);border-radius:10px;padding:14px 16px;
  font-size:13.5px;line-height:1.5}
body.noscroll{overflow:hidden}
@media (max-width:640px){
  .vcard{flex-wrap:wrap}
  .vthumb{width:100%;height:150px}
  .vplay{margin-left:0}
  .vmodal-note .dim{margin-left:0}
  .vmodal{padding:10px}
}

/* ================= SELL DECISION — verdict screen (video layout) ================= */
.navsep{width:1px;height:22px;background:var(--line);margin:0 4px;align-self:center}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

.sellform .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.sellform label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.sellform input,.sellform select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit}
.sellform .btn{padding:10px 16px}

.verdict{border-left:6px solid var(--green);background:linear-gradient(180deg,#FFFFFF 0%,#F7FCF8 100%)}
.verdict.wait{border-left-color:var(--orange)}
.verdict.store{border-left-color:var(--blue)}
.vrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.veyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--muted)}
.vcall{font-size:44px;font-weight:900;letter-spacing:.5px;color:var(--green);line-height:1.05;margin:2px 0 4px}
.verdict.wait .vcall{color:var(--orange)}
.verdict.store .vcall{color:var(--blue)}
.vbest{font-size:15px;color:var(--ink)}
.vbest b{color:var(--green)}
.vreasons{list-style:none;margin:14px 0 8px;padding:0;display:flex;flex-direction:column;gap:8px}
.vreasons li{position:relative;padding-left:20px;font-size:14px;line-height:1.5;color:var(--ink)}
.vreasons li::before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;background:var(--green-mid)}
.verdict.wait .vreasons li::before{background:var(--orange)}
.verdict.store .vreasons li::before{background:var(--blue)}

.ring{text-align:center;flex:0 0 auto}
.ringsvg{width:84px;height:84px;display:block}
.ringlabel{font-size:9.5px;letter-spacing:.1em;font-weight:800;color:var(--muted);margin-top:2px}

.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pills{display:flex;gap:6px}
.pill{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;
  padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}

.chartwrap{margin-top:8px}
.chart{width:100%;height:auto;display:block}
.chartfoot{display:flex;justify-content:flex-end;font-size:11.5px;color:var(--muted);margin-top:2px}

.earn{font-size:38px;font-weight:900;color:var(--orange);line-height:1.1;margin:8px 0 2px}
.minitable{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
.minitable td{padding:7px 0;border-bottom:1px solid var(--line)}
.minitable td:last-child{text-align:right;font-weight:700}
.minitable tr.tot td{border-bottom:0;font-weight:800;color:var(--green)}

.signals{background:var(--panel);border-radius:var(--radius);padding:12px 16px;margin-top:14px;
  font-size:13px;color:var(--green);line-height:1.6}
.signals b{color:var(--green)}
.cta{background:var(--cream);border:1px solid #F3D9BC}
.cta b{color:var(--cream-tx)}

/* ================= ALERTS ================= */
.alertlist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.alert{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-left:5px solid var(--green-mid);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.alert.high{border-left-color:var(--red)}
.alert.medium{border-left-color:var(--orange)}
.alert.good{border-left-color:var(--green-mid)}
.alert.info{border-left-color:var(--blue)}
.alert b{color:var(--green)}
.chip.red{background:#FBEAEA;color:var(--red)}

/* ================= MY SALES ================= */
.salelist{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.salerow{display:flex;align-items:baseline;gap:10px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.salerow:last-child{border-bottom:0}
.saledate{color:var(--muted);font-size:12.5px;min-width:58px}
.salemkt{font-weight:700;color:var(--ink)}
.saleprice{margin-left:auto;font-weight:800;color:var(--green)}
.btnlink{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit}
@media (max-width:640px){
  .vcall{font-size:34px}
  .earn{font-size:30px}
  .sellform .frow{grid-template-columns:1fr 1fr}
}

/* ================= MERGED BUILD: greeting hero, weather strip, options, benchmark, roadmap ================= */
.greet{margin:2px 0 14px}
.gdate{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--muted);text-transform:uppercase}
.ghello{font-size:30px;font-weight:900;color:var(--green);margin:4px 0 2px;line-height:1.15}
.gsub{color:var(--muted);font-size:14.5px}
.gsub b{color:var(--ink)}

.wstrip{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  margin-top:14px;box-shadow:var(--shadow)}
.whead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.whead b{color:var(--green)}
.whead .dim{font-size:12px}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.wcell{background:var(--panel);border-radius:10px;padding:9px 6px;text-align:center}
.wcell.wet{background:var(--blue-bg)}
.wcell .wd{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wcell .wt{font-size:19px;font-weight:800;color:var(--green);margin:2px 0}
.wcell .wr{font-size:11.5px;color:var(--muted)}
.wadv{margin-top:10px;font-size:13.5px;background:var(--cream);color:var(--cream-tx);border-radius:10px;padding:9px 12px}

.splitbox{background:var(--panel);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13.5px;color:var(--green)}
.opttable{margin-top:12px;border-top:1px dashed var(--line)}
.opttable td:first-child{color:var(--ink)}

.bench{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.bench .bnum{font-size:24px;font-weight:900;color:var(--green);line-height:1.2}
.bench .bmid{border-left:1px dashed var(--line);border-right:1px dashed var(--line);padding:0 14px}
.bench .bnum.pos{color:var(--green-mid)}
.bench .bnum.neg{color:var(--red)}
.bench .dim{font-weight:600;font-size:14px}

.roadmap{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.rmitem{display:flex;gap:10px;align-items:flex-start}
.rmitem b{color:var(--green)}
.rmitem .dim{font-size:12.5px;line-height:1.4}
@media (max-width:900px){ .bench{grid-template-columns:1fr} .bench .bmid{border:0;padding:0} }
@media (max-width:640px){ .wrow{grid-template-columns:repeat(3,1fr)} .ghello{font-size:24px} }

</style>
</head>
<body>
